<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FleetCheck - Inspections</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<header>

    <h1>FleetCheck Inspections</h1>

</header>


<nav>

    <a href="dashboard.html">
        Dashboard
    </a>

    <a href="vehicles.html">
        Vehicles
    </a>

    <a href="inspections.html">
        Inspections
    </a>

    <a href="maintenance.html">
        Maintenance
    </a>

    <a href="#" onclick="logout()">
        Logout
    </a>

</nav>


<div class="container">


    <!-- =====================================
         NEW INSPECTION
         ===================================== -->

    <div class="card">

        <h2>New Vehicle Inspection</h2>


        <form id="inspectionForm">


            <!-- Vehicle -->

            <label for="inspectionVehicle">
                Vehicle
            </label>

            <select
                id="inspectionVehicle"
                required>

                <option value="">
                    Select a vehicle
                </option>

            </select>


            <!-- Inspection Type -->

            <label for="inspectionType">
                Inspection Type
            </label>

            <select
                id="inspectionType"
                required>

                <option value="">
                    Select inspection type
                </option>

                <option value="Pre-Trip">
                    Pre-Trip
                </option>

                <option value="Post-Trip">
                    Post-Trip
                </option>

            </select>


            <!-- =================================
                 CHECKLIST
                 ================================= -->

            <h3>
                Inspection Checklist
            </h3>


            <div class="inspection-item">

                <label for="brakes">
                    Brakes
                </label>

                <select
                    id="brakes"
                    class="inspection-result"
                    data-item="Brakes">

                    <option value="Pass">
                        Pass
                    </option>

                    <option value="Needs Attention">
                        Needs Attention
                    </option>

                    <option value="Fail">
                        Fail
                    </option>

                </select>

            </div>


            <div class="inspection-item">

                <label for="tires">
                    Tires
                </label>

                <select
                    id="tires"
                    class="inspection-result"
                    data-item="Tires">

                    <option value="Pass">
                        Pass
                    </option>

                    <option value="Needs Attention">
                        Needs Attention
                    </option>

                    <option value="Fail">
                        Fail
                    </option>

                </select>

            </div>


            <div class="inspection-item">

                <label for="lights">
                    Lights
                </label>

                <select
                    id="lights"
                    class="inspection-result"
                    data-item="Lights">

                    <option value="Pass">
                        Pass
                    </option>

                    <option value="Needs Attention">
                        Needs Attention
                    </option>

                    <option value="Fail">
                        Fail
                    </option>

                </select>

            </div>


            <div class="inspection-item">

                <label for="mirrors">
                    Mirrors
                </label>

                <select
                    id="mirrors"
                    class="inspection-result"
                    data-item="Mirrors">

                    <option value="Pass">
                        Pass
                    </option>

                    <option value="Needs Attention">
                        Needs Attention
                    </option>

                    <option value="Fail">
                        Fail
                    </option>

                </select>

            </div>


            <div class="inspection-item">

                <label for="fluids">
                    Fluids
                </label>

                <select
                    id="fluids"
                    class="inspection-result"
                    data-item="Fluids">

                    <option value="Pass">
                        Pass
                    </option>

                    <option value="Needs Attention">
                        Needs Attention
                    </option>

                    <option value="Fail">
                        Fail
                    </option>

                </select>

            </div>


            <div class="inspection-item">

                <label for="safety">
                    Safety Equipment
                </label>

                <select
                    id="safety"
                    class="inspection-result"
                    data-item="Safety Equipment">

                    <option value="Pass">
                        Pass
                    </option>

                    <option value="Needs Attention">
                        Needs Attention
                    </option>

                    <option value="Fail">
                        Fail
                    </option>

                </select>

            </div>


            <!-- =================================
                 OVERALL STATUS
                 ================================= -->

            <label for="inspectionStatus">
                Overall Status
            </label>

            <select
                id="inspectionStatus"
                required>

                <option value="">
                    Select status
                </option>

                <option value="Passed">
                    Passed
                </option>

                <option value="Needs Attention">
                    Needs Attention
                </option>

                <option value="Failed">
                    Failed
                </option>

            </select>


            <!-- Notes -->

            <label for="inspectionNotes">
                Inspection Notes
            </label>

            <textarea
                id="inspectionNotes"
                rows="5"
                placeholder="Enter any problems or additional notes...">
            </textarea>


            <!-- Submit -->

            <button type="submit">
                Save Inspection
            </button>


        </form>

    </div>


    <!-- =====================================
         INSPECTION HISTORY
         ===================================== -->

    <div class="card">

        <h2>
            Inspection History
        </h2>


        <table id="inspectionTable">

            <thead>

                <tr>

                    <th>
                        Date
                    </th>

                    <th>
                        Vehicle
                    </th>

                    <th>
                        Type
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Notes
                    </th>

                </tr>

            </thead>


            <tbody>

            </tbody>

        </table>

    </div>


</div>


<script src="js/script.js"></script>

</body>

</html>
