<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetCheck - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container">

    <h1>FleetCheck</h1>
    <p class="subtitle">Vehicle Inspection & Maintenance Tracker</p>

    <form id="loginForm">

        <label>Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required>

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required>

        <button type="submit">
            Login
        </button>

    </form>

    <p class="demo-text">
        Sprint 1 Demo Login<br>
        Any email and password will continue to the dashboard.
    </p>

</div>

<script src="js/script.js"></script>

</body>
</html>
