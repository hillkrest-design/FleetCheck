<div class="container">

<div class="card">

<h2>Add Vehicle</h2>

<form id="vehicleForm">

<label>Year</label>

<input type="number" id="year" required>

<label>Make</label>

<input type="text" id="make" required>

<label>Model</label>

<input type="text" id="model" required>

<label>VIN</label>

<input type="text" id="vin">

<label>Mileage</label>

<input type="number" id="mileage">

<button type="submit">

Save Vehicle

</button>

</form>

</div>

<div class="card">

<h2>Fleet Vehicles</h2>

<table id="vehicleTable">

<thead>

<tr>

<th>Year</th>

<th>Make</th>

<th>Model</th>

<th>VIN</th>

<th>Mileage</th>

<th>Action</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>
